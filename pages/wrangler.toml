# Cloudflare Pages config for the `iknowthattune` Pages project. Pages
# doesn't support `--config <path>` or `--cwd`, so the deploy step copies this
# file over the repo-root `wrangler.toml` (after the Worker deploy step, which
# uses that root config) and runs `wrangler pages deploy` from the repo root —
# see .github/workflows/deploy.yml. The standalone Worker
# (main = "workers/api/router.ts") is a separate deployment with its own
# bindings, defined in the original root wrangler.toml.
name = "iknowthattune"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
account_id = "3d3a4327a036de9902a7760a03e23ec4"

# Used by functions/og/[challengeId].ts to read challenge metadata for OG tags.
[[kv_namespaces]]
binding = "CHALLENGES_KV"
id = "335289cc2fe64069ad118f9fcc4f13d6"

# Used by functions/api/[[path]].ts to forward /api/* to the iknowthattune
# Worker, which holds the R2 and Durable Object bindings.
[[services]]
binding = "API"
service = "iknowthattune"
