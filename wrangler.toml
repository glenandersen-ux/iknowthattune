name = "iknowthattune"
main = "workers/api/challenge.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[kv_namespaces]]
binding = "CHALLENGES_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "iknowthattune"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "LeaderboardDO"

[[durable_objects.bindings]]
name = "DAILY_DROP"
class_name = "DailyDropDO"

[[migrations]]
tag = "v1"
new_classes = ["LeaderboardDO", "DailyDropDO"]
