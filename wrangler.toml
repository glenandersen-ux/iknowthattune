name = "iknowthattune"
main = "workers/api/router.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
account_id = "3d3a4327a036de9902a7760a03e23ec4"

[vars]
SPOTIFY_CLIENT_ID = "225bd221c62f48a4ad92d22daf00fa42"
# Google OAuth client ID — paste from https://console.cloud.google.com (OAuth 2.0 Credentials)
GOOGLE_CLIENT_ID = "119505165336-l7aloajm69rnmcnrr20lm6nfjs85ieid.apps.googleusercontent.com"
# Secrets (never commit — add via terminal):
#   wrangler secret put SPOTIFY_CLIENT_SECRET
#   wrangler secret put GOOGLE_CLIENT_SECRET

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[kv_namespaces]]
binding = "CHALLENGES_KV"
id = "335289cc2fe64069ad118f9fcc4f13d6"

# Auth KV namespace — create it once with:
#   npx wrangler kv namespace create AUTH_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "08d209668c9d4636b48cf4f9b824ff55"

[[r2_buckets]]
binding = "R2"
bucket_name = "iknowthattune"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "LeaderboardDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LeaderboardDO"]

# Rate limiting (TechStack §D.13) is configured in the Cloudflare Dashboard
# under Security -> Rate Limiting, not via wrangler.toml.
